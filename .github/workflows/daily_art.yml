name: Daily Art Recommendation

on:
  schedule:
    # 11:25 UTC = 7:25 a.m. ET during daylight saving time
    - cron: "25 11 * * *"
  workflow_dispatch:

# Prevent a manual run and scheduled run from updating the feed simultaneously.
concurrency:
  group: daily-art-feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedgenerator openai truststore

      - name: Run daily art script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python daily_art_recommendation.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.xml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Daily art update: $(date -u +'%Y-%m-%d')"
          git push
